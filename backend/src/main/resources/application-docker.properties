# Database Configuration
spring.datasource.url=jdbc:mysql://mysql-db:3306/billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# JWT Secret (CHANGE THIS IN PRODUCTION!)
jwt.secret.key=your-super-secret-key-change-in-production-123456

# File Upload Configuration (local for docker)
# AWS S3 is commented out for docker, but you can uncomment and add AWS credentials
# aws.access.key=YOUR_AWS_KEY
# aws.secret.key=YOUR_AWS_SECRET
# aws.region=ap-south-1
# aws.bucket.name=your-bucket

# Razorpay (optional - you can add later)
# razorpay.key.id=your_razorpay_key
# razorpay.key.secret=your_razorpay_secret

# CORS Configuration (allow frontend)
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.in.amitPandey.billingsoftware=DEBUG